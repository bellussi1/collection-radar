<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><base href="https://www.mercadolivre.com.br/"><title>mercadolivre-search</title></head>
<body>
<!-- Amostra montada a partir da estrutura real do card de busca do Mercado Livre.
     A captura ao vivo foi bloqueada em 2026-11-10; atualize com npm run fixtures:capture
     quando a página voltar a responder. -->
<li class="ui-search-layout__item">
  <div class="poly-card">
    <a class="poly-component__title" href="https://www.mercadolivre.com.br/livro-exemplo/p/MLB123456">Livro Exemplo — Autor</a>
    <div class="poly-price__current">
      <span class="andes-money-amount__fraction">123</span>
      <span class="andes-money-amount__cents">45</span>
    </div>
    <span class="poly-component__seller">Livraria Exemplo</span>
    <span>4.8</span>
    <span class="poly-component__location">São Paulo</span>
    <img class="poly-component__picture" src="https://http2.mlstatic.com/exemplo.jpg" />
    <span>Usado</span>
    <span>Grátis</span>
  </div>
</li>
<li class="ui-search-layout__item">
  <div class="poly-card">
    <a class="poly-component__title" href="https://www.mercadolivre.com.br/outro-livro/p/MLB654321">Outro Livro</a>
    <div class="poly-price__current">
      <span class="andes-money-amount__fraction">89</span>
      <span class="andes-money-amount__cents">90</span>
    </div>
    <span class="poly-component__location">Rio de Janeiro</span>
    <img class="poly-component__picture" src="https://http2.mlstatic.com/outro.jpg" />
    <span>Novo</span>
  </div>
</li>
</body>
</html>
