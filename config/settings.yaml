scan:
  # 0 = todas as consultas. Com 40, o radar roda 40 por vez e retoma de onde parou.
  max_queries: 40
  limit_per_query: 30
  # Pausa entre consultas para não irritar os sites.
  delay_ms: 2500
  # Corte de confiança para entrar no digest.
  min_score: 0.62
  # Reservado para alerta imediato (o MVP manda um digest por rodada).
  immediate_score: 0.82
  max_age_days: 30
  # Queda mínima para alertar de novo uma obra já alertada.
  price_drop_pct: 5

sources:
  estante: true
  olx: true
  mercadolivre: true
  enjoei: true

